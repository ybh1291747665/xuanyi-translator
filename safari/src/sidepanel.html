<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>选译</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app" id="app">
    <header class="app-header" id="appHeader">
      <div class="brand">
        <img class="brand-mark" src="../icons/icon48.png" alt="" width="30" height="30">
        <div class="brand-copy">
          <span class="brand-name">选译</span>
          <span class="brand-tagline">划词即译</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="historyBtn" type="button" title="翻译历史" aria-label="翻译历史">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.8 9A8.4 8.4 0 1 1 4 15.4"/>
            <path d="M3.5 4.5V9H8"/>
            <path d="M12 8v4.4l2.8 1.7"/>
          </svg>
        </button>
        <button class="icon-btn" id="settingsBtn" type="button" title="设置" aria-label="设置">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h9.5M17.5 7H20M4 17h2.5M10.5 17H20M4 12h4.5M12.5 12H20"/>
            <circle cx="15.5" cy="7" r="2"/>
            <circle cx="8.5" cy="17" r="2"/>
            <circle cx="10.5" cy="12" r="2"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="main" id="mainView">
      <div class="lang-bar">
        <label class="lang-field" for="sourceLang">
          <span class="lang-label">原文</span>
          <span class="select-wrap">
            <select id="sourceLang" aria-label="原文语言"></select>
            <svg class="select-chevron icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </span>
        </label>
        <button class="swap-btn" id="swapBtn" type="button" title="交换原文和译文语言" aria-label="交换语言" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 4 3 8l4 4M3 8h14"/>
            <path d="m17 20 4-4-4-4M21 16H7"/>
          </svg>
        </button>
        <label class="lang-field" for="targetLang">
          <span class="lang-label">译文</span>
          <span class="select-wrap">
            <select id="targetLang" aria-label="译文语言"></select>
            <svg class="select-chevron icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </span>
        </label>
      </div>

      <div class="main-scroll" id="mainScroll">
        <section class="empty-state" id="emptyState" aria-label="使用提示">
          <div class="empty-art" aria-hidden="true">
            <div class="empty-glow"></div>
            <img src="../icons/icon128.png" alt="" width="78" height="78">
            <span class="floating-letter floating-letter-a">A</span>
            <span class="floating-letter floating-letter-z">文</span>
          </div>
          <h2>选中，即译</h2>
          <p class="empty-desc" id="emptyDesc">在任意网页划选单词或句子，译文会自动出现在侧边栏。</p>
          <button class="demo-btn" id="demoBtn" type="button">
            翻译一个示例
            <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
          <div class="empty-tips">
            <div class="empty-tip">
              <span class="tip-index">1</span>
              <span id="tipAuto">选中文字后，侧栏自动更新译文</span>
            </div>
            <div class="empty-tip">
              <span class="tip-index">2</span>
              <span>也可以右键选中文字，选择「选译」</span>
            </div>
            <div class="empty-tip">
              <span class="tip-index">3</span>
              <span>翻译历史只保存在本机，可随时清除</span>
            </div>
          </div>
        </section>

        <section class="workspace" id="workspace" hidden>
          <article class="card source-card" id="sourceCard">
            <div class="card-head">
              <div class="label-row">
                <span class="eyebrow">原文</span>
                <span class="lang-chip" id="detectedChip" hidden></span>
              </div>
              <div class="card-actions">
                <button class="mini-btn" id="copySourceBtn" type="button" title="复制原文" aria-label="复制原文" disabled>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="9" y="9" width="11" height="11" rx="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                  </svg>
                </button>
                <button class="mini-btn" id="speakSourceBtn" type="button" title="朗读原文" aria-label="朗读原文" disabled>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
                    <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
                  </svg>
                </button>
              </div>
            </div>
            <div class="source-text" id="sourceText" dir="auto"></div>
            <div class="phonetic source-phonetic" id="sourcePhonetic" hidden>
              <span class="phonetic-label" id="sourcePhoneticLabel"></span>
              <span id="sourcePhoneticText"></span>
            </div>
            <div class="source-meta" id="sourceMeta"></div>
          </article>

          <article class="card result-card" id="resultCard" data-status="loading">
            <div class="card-head">
              <div class="label-row">
                <span class="eyebrow eyebrow-accent">译文</span>
                <span class="provider-chip" id="providerChip" hidden></span>
              </div>
              <div class="card-actions">
                <button class="mini-btn" id="copyTranslationBtn" type="button" title="复制译文" aria-label="复制译文" disabled>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="9" y="9" width="11" height="11" rx="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                  </svg>
                </button>
                <button class="mini-btn" id="speakTranslationBtn" type="button" title="朗读译文" aria-label="朗读译文" disabled>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
                    <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
                  </svg>
                </button>
                <button class="mini-btn" id="retryBtn" type="button" title="重新翻译" aria-label="重新翻译" hidden>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/>
                    <path d="M20.5 4.5V10H15"/>
                  </svg>
                </button>
              </div>
            </div>

            <div class="loading-state" id="loadingState">
              <div class="skeleton skeleton-title"></div>
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line skeleton-short"></div>
              <div class="loading-caption">
                <span class="pulse-dot"></span>
                <span id="loadingProvider">正在翻译</span>
                <button class="text-btn slow-retry" id="slowRetryBtn" type="button" hidden>重试</button>
              </div>
            </div>

            <div class="result-content" id="resultContent" aria-live="polite" hidden>
              <div class="translation-text" id="translationText" dir="auto"></div>
              <div class="phonetic target-phonetic" id="targetPhonetic" hidden>
                <span class="phonetic-label" id="targetPhoneticLabel"></span>
                <span id="targetPhoneticText"></span>
              </div>
              <div class="dictionary" id="dictionary" hidden></div>
              <div class="result-footer" id="resultFooter" hidden>
                <span class="latency" id="latency"></span>
                <span class="result-pair" id="resultPair"></span>
              </div>
            </div>

            <div class="idle-state" id="idleState" hidden>
              <p id="idleMessage">自动翻译已关闭，点击下方按钮翻译这段文字。</p>
              <button class="primary-btn" id="translateBtn" type="button">翻译</button>
            </div>

            <div class="error-state" id="errorState" hidden>
              <span class="error-mark" aria-hidden="true">!</span>
              <div class="error-copy">
                <p class="error-title" id="errorTitle">没有翻译成功</p>
                <p class="error-message" id="errorMessage"></p>
                <div class="error-actions">
                  <button class="secondary-btn" id="errorRetryBtn" type="button">重试</button>
                  <button class="text-btn" id="errorSettingsBtn" type="button" hidden>检查设置</button>
                </div>
              </div>
            </div>
          </article>

          <div class="page-context" id="pageContext" hidden>
            <svg class="icon icon-xs" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>
            </svg>
            <span class="page-host" id="pageHost"></span>
            <span class="page-separator" id="pageSeparator" aria-hidden="true">·</span>
            <span class="page-title" id="pageTitle"></span>
          </div>
        </section>
      </div>
    </main>

    <footer class="app-footer" id="appFooter">
      <label class="toggle-wrap" title="关闭后，选中文字只捕获内容，点击翻译才会请求接口">
        <input type="checkbox" id="autoTranslateToggle">
        <span class="switch" aria-hidden="true"></span>
        <span class="toggle-label">自动翻译</span>
      </label>
      <span class="shortcut-hint" id="shortcutHint"></span>
    </footer>

    <section class="history-view" id="historyView" aria-label="翻译历史" hidden>
      <header class="history-header">
        <button class="icon-btn" id="historyBackBtn" type="button" title="返回翻译" aria-label="返回翻译">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="history-heading">
          <h2>翻译历史</h2>
          <p id="historyCount"></p>
        </div>
        <button class="icon-btn" id="clearHistoryBtn" type="button" title="清空历史" aria-label="清空历史">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"/>
          </svg>
        </button>
      </header>
      <div class="history-list" id="historyList"></div>
      <div class="history-empty" id="historyEmpty" hidden>
        <div class="history-empty-mark" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M3.8 9A8.4 8.4 0 1 1 4 15.4"/>
            <path d="M3.5 4.5V9H8"/>
            <path d="M12 8v4.4l2.8 1.7"/>
          </svg>
        </div>
        <p id="historyEmptyText">还没有翻译记录</p>
        <button class="text-btn" id="historySettingsBtn" type="button" hidden>打开设置</button>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="browser-compat.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
